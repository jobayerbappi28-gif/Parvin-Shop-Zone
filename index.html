<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফ্যাশন গ্যালারি - ক্লথিং শপ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }
        header { background-color: #111; color: #fff; padding: 20px; text-align: center; }
        header h1 { font-size: 28px; margin-bottom: 5px; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .product-card { background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding-bottom: 15px; }
        .product-card img { width: 100%; height: 280px; object-fit: cover; }
        .product-card h3 { margin: 15px 0 8px; font-size: 18px; }
        .price { color: #e74c3c; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .buy-btn { background-color: #25d366; color: white; padding: 10px 18px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; }
        .buy-btn:hover { background-color: #128c7e; }
        footer { text-align: center; padding: 20px; background: #eee; margin-top: 40px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>ফ্যাশন স্টোর</h1>
        <p>সেরা মানের কাপড়ের বিশ্বস্ত প্রতিষ্ঠান</p>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 20px; text-align: center;">আমাদের কালেকশন</h2>
        <div class="product-grid">
            
            <!-- প্রোডাক্ট ১ -->
            <div class="product-card">
                <img src="https://via.placeholder.com/300x350" alt="প্রোডাক্ট ১">
                <h3>প্রিমিয়াম পাঞ্জাবি</h3>
                <div class="price">৳ ১,৫০০</div>
                <a href="https://wa.me/8801700000000?text=আমি%20প্রিমিয়াম%20পাঞ্জাবি%20কিনতে%20চাই" class="buy-btn" target="_blank">অর্ডার করুন (WhatsApp)</a>
            </div>

            <!-- প্রোডাক্ট ২ -->
            <div class="product-card">
                <img src="https://via.placeholder.com/300x350" alt="প্রোডাক্ট ২">
                <h3>কটন টি-শার্ট</h3>
                <div class="price">৳ ৪৫০</div>
                <a href="https://wa.me/8801700000000?text=আমি%20কটন%20টি-শার্ট%20কিনতে%20চাই" class="buy-btn" target="_blank">অর্ডার করুন (WhatsApp)</a>
            </div>

            <!-- প্রোডাক্ট ৩ -->
            <div class="product-card">
                <img src="https://via.placeholder.com/300x350" alt="প্রোডাক্ট ৩">
                <h3>ডিজাইনার থ্রি-পিস</h3>
                <div class="price">৳ ২,২০০</div>
                <a href="https://wa.me/8801700000000?text=আমি%20ডিজাইনার%20থ্রি-পিস%20কিনতে%20চাই" class="buy-btn" target="_blank">অর্ডার করুন (WhatsApp)</a>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; ২০২৬ আপনার শপ। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

</body>
</html>
